# Snippet for ~/.kimi-code/config.toml — points Kimi Code's "litellm"
# provider at the bridge instead of directly at your gateway, so
# gpt-6-sol / gpt-5.6-terra keep working with tools + reasoning.

[providers.litellm]
base_url = "http://127.0.0.1:4801/v1"
type = "openai"
api_key = "local-bridge-no-secret-needed"

[models."litellm/gpt-6-sol"]
provider = "litellm"
model = "gpt-6-sol"
max_context_size = 1050000
max_output_size = 128000
capabilities = [ "thinking", "tool_use" ]

[models."litellm/gpt-5.6-terra"]
provider = "litellm"
model = "gpt-5.6-terra"
max_context_size = 922000
max_output_size = 128000
capabilities = [ "thinking", "tool_use" ]
